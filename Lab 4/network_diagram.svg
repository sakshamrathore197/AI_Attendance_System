<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <rect width="900" height="480" fill="#0b0f14"/>

  <text x="30" y="34" fill="#e5e9ef" font-size="16" font-weight="bold">Lab 4 — Secure Remote Access (Subnet Router Model)</text>
  <text x="30" y="54" fill="#7c8a9c" font-size="12">No public IP required. No port forwarding. No RTSP exposed to the internet.</text>

  <!-- Camera LAN box -->
  <rect x="40" y="100" width="230" height="150" rx="6" fill="#121821" stroke="#1f2937"/>
  <text x="60" y="128" fill="#38bdf8" font-size="13" font-weight="bold">Camera / NVR LAN</text>
  <text x="60" y="148" fill="#e5e9ef" font-size="11">192.168.29.0/24</text>
  <rect x="60" y="162" width="190" height="26" rx="3" fill="#0e1420" stroke="#1f2937"/>
  <text x="70" y="179" fill="#e5e9ef" font-size="11">Entrance cam  .168:554</text>
  <rect x="60" y="194" width="190" height="26" rx="3" fill="#0e1420" stroke="#1f2937"/>
  <text x="70" y="211" fill="#e5e9ef" font-size="11">Exit cam / NVR chan .170:554</text>

  <!-- Edge laptop / subnet router -->
  <rect x="340" y="100" width="230" height="150" rx="6" fill="#121821" stroke="#34d399"/>
  <text x="360" y="128" fill="#34d399" font-size="13" font-weight="bold">Edge Laptop</text>
  <text x="360" y="148" fill="#e5e9ef" font-size="11">Tailscale subnet router</text>
  <text x="360" y="166" fill="#7c8a9c" font-size="10">advertises 192.168.29.0/24</text>
  <text x="360" y="182" fill="#7c8a9c" font-size="10">no inbound ports opened</text>
  <text x="360" y="198" fill="#7c8a9c" font-size="10">outbound-only to Tailscale coord.</text>
  <text x="360" y="220" fill="#e5e9ef" font-size="11">Runs: MediaMTX, AI worker,</text>
  <text x="360" y="234" fill="#e5e9ef" font-size="11">health_monitor.py, dashboard</text>

  <!-- Tailscale cloud -->
  <ellipse cx="565" cy="330" rx="120" ry="55" fill="#0e1420" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="565" y="325" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Tailscale (WireGuard)</text>
  <text x="565" y="342" fill="#7c8a9c" font-size="10" text-anchor="middle">encrypted mesh — no public</text>
  <text x="565" y="356" fill="#7c8a9c" font-size="10" text-anchor="middle">exposure, NAT/CGNAT-safe</text>

  <!-- Remote device -->
  <rect x="740" y="290" width="130" height="80" rx="6" fill="#121821" stroke="#34d399"/>
  <text x="755" y="315" fill="#34d399" font-size="12" font-weight="bold">Remote device</text>
  <text x="755" y="332" fill="#e5e9ef" font-size="10">Tailscale client</text>
  <text x="755" y="348" fill="#e5e9ef" font-size="10">100.x.x.x</text>

  <!-- Arrows: camera to edge -->
  <line x1="270" y1="175" x2="335" y2="175" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="278" y="167" fill="#7c8a9c" font-size="9">local RTSP</text>

  <!-- edge to tailscale -->
  <line x1="480" y1="250" x2="530" y2="290" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tailscale to remote -->
  <line x1="660" y1="325" x2="738" y2="325" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Forbidden path -->
  <rect x="340" y="400" width="500" height="60" rx="6" fill="#1a1010" stroke="#f87171"/>
  <text x="360" y="424" fill="#f87171" font-size="12" font-weight="bold">NOT USED: direct port-forward of :554 to the public internet</text>
  <text x="360" y="442" fill="#7c8a9c" font-size="10">Forbidden by Section 10 — RTSP/admin ports are never exposed publicly.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
