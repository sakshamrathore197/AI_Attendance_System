services:
  db:
    image: postgres:16-alpine
    container_name: attendance-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-attendance_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  attendance-app:
    build: .
    container_name: ai-attendance-system
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-attendance_db}
    ports:
      - "8000:8000"
    volumes:
      # Uploaded video files, employee enrollment photos, unknown-face
      # crops, and attendance screenshot proofs - all under static/uploads
      # and static/screenshots per the repo's directory structure.
      - ./static/uploads:/app/static/uploads
      - ./static/screenshots:/app/static/screenshots
      - ./static/processed_videos:/app/static/processed_videos

      # InsightFace's model cache - avoids re-downloading buffalo_l on
      # every container recreation if you removed the RUN pre-warm step
      # from the Dockerfile (or want it kept outside the image either way).
      - insightface-models:/root/.insightface

volumes:
  postgres_data:
  insightface-models:

